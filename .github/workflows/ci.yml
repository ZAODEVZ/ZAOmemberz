name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public fallbacks exist in code; the DB client is lazy and no route
          # is prerendered against it, so the build needs no real secrets.
          NEXT_PUBLIC_AUTH_DOMAIN: localhost:3000
          NEXT_PUBLIC_AUTH_URL: http://localhost:3000
